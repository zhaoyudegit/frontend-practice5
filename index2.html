<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF‑8">
    <title>图书收藏管理</title>
    <style>
        * {box‑sizing: border‑box;font‑family:Microsoft Yahei;}
        .container{max‑width:700px;margin:30px auto;padding:0 20px;}
        .form‑item{margin:10px 0;}
        input{padding:6px;width:220px;font‑size:14px;}
        button{padding:6px 12px;margin:2px;border:none;background:#2478ff;color:white;border‑radius:4px;cursor:pointer;}
        .del{background:#ed4040;}
        .edit{background:#ffa600;}
        .tip‑error{color:#ed4040;height:22px;font‑size:14px;}
        table{width:100%;margin‑top:20px;border‑collapse:collapse;}
        th,td{border:1px solid #ccc;padding:8px;text‑align:center;}
    </style>
</head>
<body>
<div class="container">
    <h2>📚 图书收藏管理系统</h2>
    <div class="tip‑error" id="errorTip"></div>
    <div class="form‑item">
        <label>书名：</label>
        <input type="text" id="bookName" placeholder="请输入书名">
    </div>
    <div class="form‑item">
        <label>作者：</label>
        <input type="text" id="author" placeholder="请输入作者">
    </div>
    <div class="form‑item">
        <label>评分：</label>
        <input type="number" min="0" max="10" id="score" placeholder="0‑10">
    </div>
    <div class="form‑item">
        <button id="btnAdd">新增图书</button>
        <button id="btnCancel" style="background:#888;display:none">取消编辑</button>
    </div>
    <table>
        <thead>
        <tr>
            <th>书名</th>
            <th>作者</th>
            <th>评分</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>
</div>

<script>
    let bookList = JSON.parse(localStorage.getItem("bookList")) || [];
    let editIndex = null;

    const nameInput = document.getElementById("bookName");
    const authorInput = document.getElementById("author");
    const scoreInput = document.getElementById("score");
    const btnAdd = document.getElementById("btnAdd");
    const btnCancel = document.getElementById("btnCancel");
    const tableBody = document.getElementById("tableBody");
    const errorTip = document.getElementById("errorTip");

    function saveStorage(){
        localStorage.setItem("bookList",JSON.stringify(bookList));
    }

    function render(){
        tableBody.innerHTML = "";
        bookList.forEach((item,index)=>{
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${item.name}</td>
                <td>${item.author}</td>
                <td>${item.score}</td>
                <td>
                    <button class="edit" onclick="openEdit(${index})">修改</button>
                    <button class="del" onclick="deleteItem(${index})">删除</button>
                </td>
            `;
            tableBody.appendChild(tr);
        })
    }

    function clearForm(){
        nameInput.value = "";
        authorInput.value = "";
        scoreInput.value = "";
        errorTip.innerText = "";
        editIndex = null;
        btnAdd.innerText = "新增图书";
        btnCancel.style.display = "none";
    }

    btnAdd.onclick = function(){
        const name = nameInput.value.trim();
        const author = authorInput.value.trim();
        const score = Number(scoreInput.value.trim());
        if(!name){
            errorTip.innerText = "错误：书名不能为空！";
            return;
        }
        errorTip.innerText = "";
        if(editIndex === null){
            bookList.push({name,author,score});
        }else{
            bookList[editIndex] = {name,author,score};
        }
        saveStorage();
        render();
        clearForm();
    }

    window.openEdit = function(idx){
        editIndex = idx;
        const data = bookList[idx];
        nameInput.value = data.name;
        authorInput.value = data.author;
        scoreInput.value = data.score;
        btnAdd.innerText = "保存修改";
        btnCancel.style.display = "inline‑block";
    }

    window.deleteItem = function(idx){
        bookList.splice(idx,1);
        saveStorage();
        render();
    }

    btnCancel.onclick = clearForm;
    render();
</script>
</body>
</html>
